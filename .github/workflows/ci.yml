name: Validate MVP
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: wikimf
          POSTGRES_PASSWORD: wikimf
          POSTGRES_DB: wikimf
        ports: [54329:5432]
        options: >-
          --health-cmd "pg_isready -U wikimf -d wikimf"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://wikimf:wikimf@127.0.0.1:54329/wikimf
      TEST_DATABASE_URL: postgresql+psycopg://wikimf:wikimf@127.0.0.1:54329/wikimf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r apps/backend/requirements.lock
      - run: python scripts/generate_contracts.py --check
      - run: python -m alembic -c apps/backend/alembic.ini upgrade head
      - run: python -m pytest -q -p no:cacheprovider
      - run: python -m alembic -c apps/backend/alembic.ini downgrade base
      - run: python -m alembic -c apps/backend/alembic.ini upgrade head
  tracker-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix packages/tracker test
      - run: npm --prefix packages/tracker run build
      - run: npm --prefix apps/extension test
      - run: npm --prefix apps/extension run build
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          license_answers=$(mktemp)
          printf 'y\n%.0s' {1..100} > "$license_answers"
          "$sdkmanager" --licenses < "$license_answers"
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Create isolated debug signing key
        run: |
          mkdir -p .tooling
          keytool -genkeypair -noprompt -keystore .tooling/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" -validity 10950 -keyalg RSA -keysize 2048
      - run: gradle testDebugUnitTest assembleDebug lintDebug --no-daemon
