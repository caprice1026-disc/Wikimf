name: Validate MVP
on:
  push:
    branches: [main, "feat/lan-*"]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: wikimf
          POSTGRES_PASSWORD: wikimf
          POSTGRES_DB: wikimf
        ports: [54329:5432]
        options: >-
          --health-cmd "pg_isready -U wikimf -d wikimf"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://wikimf:wikimf@127.0.0.1:54329/wikimf
      TEST_DATABASE_URL: postgresql+psycopg://wikimf:wikimf@127.0.0.1:54329/wikimf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r apps/backend/requirements.lock
      - run: python scripts/generate_contracts.py --check
      - run: python -m alembic -c apps/backend/alembic.ini upgrade head
      - run: python -m pytest -q -p no:cacheprovider
      - run: python -m alembic -c apps/backend/alembic.ini downgrade base
      - run: python -m alembic -c apps/backend/alembic.ini upgrade head
  tracker-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix packages/tracker test
      - run: npm --prefix packages/tracker run build
      - run: npm --prefix apps/extension test
      - run: npm --prefix apps/extension run build
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - name: Tracker collapsed-prose viewport regression
        run: |
          npx playwright install --with-deps chromium
          WIKIMF_NODE_MODULES="$PWD/node_modules" node ../../packages/tracker/test/viewport-budget.browser.js
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          license_answers=$(mktemp)
          printf 'y\n%.0s' {1..100} > "$license_answers"
          "$sdkmanager" --licenses < "$license_answers"
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Create isolated debug signing key
        run: |
          mkdir -p .tooling
          keytool -genkeypair -noprompt -keystore .tooling/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" -validity 10950 -keyalg RSA -keysize 2048
      - run: gradle testDebugUnitTest testLanUnitTest testLanLocalUnitTest testReleaseUnitTest assembleDebug assembleLan assembleLanLocal assembleRelease lintDebug lintLan lintLanLocal lintRelease --no-daemon
      - name: Verify LAN APK and release network boundary
        run: |
          python ../../scripts/verify_android_lan.py --sdk "$ANDROID_HOME"
          python ../../scripts/verify_android_lan.py --sdk "$ANDROID_HOME" --variant lanLocal
      - name: Upload CI-only LAN test APK (ephemeral signer)
        uses: actions/upload-artifact@v4
        with:
          name: wikimf-lan-ci-test-apk
          include-hidden-files: true
          path: |
            apps/android/app/build/outputs/apk/lan/app-lan.apk
            .tmp/lan-apk-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native HTTP, Reader lifecycle, and privacy regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: apps/android
          disable-animations: true
          script: gradle connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=org.wikimf.reader.ApiTransportRegressionTest,org.wikimf.reader.ReaderLifecycleRegressionTest,org.wikimf.reader.PrivacyRegressionTest,org.wikimf.reader.RecordingControlRegressionTest,org.wikimf.reader.SyncUiRegressionTest,org.wikimf.reader.SyncRetryRegressionTest,org.wikimf.reader.ReadingMeasurementRegressionTest,org.wikimf.reader.SyncSchedulingRegressionTest --no-daemon
      - name: Upload Android regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-regression-results
          path: |
            apps/android/app/build/reports/androidTests
            apps/android/app/build/outputs/androidTest-results

  lan-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix apps/dashboard ci
      - name: Install browser for native LAN form regression
        working-directory: apps/dashboard
        run: npx playwright install --with-deps chromium
      - name: Verify one-port LAN stack and PostgreSQL LAN regressions
        run: python scripts/verify_lan_stack.py
      - name: Upload LAN stack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lan-stack-results
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .tmp/lan-stack-*/compose.log
            .tmp/lan-stack-*/results.json
